<!doctype html><meta charset="utf-8"><title>Frame</title>
<style>html,body{margin:0;background:#eceef0}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
// Review screenshots only: shows one route at an exact phone size (headless Chrome can't make a window narrower than ~500px),
// then removes the launch splash once the page has settled so the shot shows the screen itself.
const q = new URLSearchParams(location.search), f = document.getElementById("f");
f.width = q.get("w") || 393; f.height = q.get("h") || 852;
f.src = q.get("p") || "/";
f.onload = () => setTimeout(() => { try { f.contentDocument.querySelector(".splash")?.remove(); } catch (e) {} }, 1500);
</script>
